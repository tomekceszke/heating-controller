# /etc/mosquitto/conf.d/hc.conf — heating-controller broker (LAN, plain MQTT, auth required)
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 1883 0.0.0.0

# Queue QoS1 messages for the persistent hc-ingest session while it is down
# (~10 msgs/min from both devices; 100k = several days).
# persistence true + persistence_location come from Debian's mosquitto.conf
autosave_interval 60
max_queued_messages 100000
max_inflight_messages 20
