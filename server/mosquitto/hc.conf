# /etc/mosquitto/conf.d/hc.conf — the shared hc-data broker (LAN, plain MQTT, auth required).
# Installed by sensors-controller (formerly heating-controller); the file name predates the rename.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 1883 0.0.0.0

# Queue QoS1 messages for the persistent ingest sessions (sc-ingest, wc-ingest, …) while they are down
# (100k = several days).
# persistence true + persistence_location come from Debian's mosquitto.conf
autosave_interval 60
max_queued_messages 100000
max_inflight_messages 20
